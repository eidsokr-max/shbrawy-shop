<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.G.STORE - المتجر</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- رأس الصفحة العلوي (الهيدر) -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
        <h2 style="color: #004aad; margin: 0;">M.G.STORE</h2>
        <div id="auth-container">
            <!-- سيتم التحكم في ظهور أزرار الدخول والخروج تلقائياً عبر auth.js -->
            <span id="user-email" style="margin-left: 15px; font-weight: bold; color: #333;"></span>
            <button id="logout-btn" style="display: none; padding: 8px 15px; background: #dc3545; color: #fff; border: none; border-radius: 5px; cursor: pointer;">Log Out</button>
        </div>
    </header>

    <!-- المحتوى الرئيسي للمتجر وعرض المنتجات -->
    <main style="max-width: 1200px; margin: 30px auto; padding: 0 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h1 style="color: #333; font-size: 24px;">قائمة المنتجات والأجهزة</h1>
            <a href="mgstore-cart.html" style="background: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">🛒 سلة المشتريات</a>
        </div>

        <!-- منطقة عرض المنتجات (تتطابق مع تصميم الكتالوج والسلة) -->
        <div id="products-grid" class="grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
            <!-- سيتم جلب وعرض المنتجات هنا ديناميكياً -->
            <p style="color: #666; font-size: 16px;">جاري تحميل المنتجات من قاعدة البيانات...</p>
        </div>
    </main>

    <!-- ربط ملفات الجافاسكريبت الأساسية للحفاظ على ترابط المنظومة -->
    <script src="mg-store-catalog.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
