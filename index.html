<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.G.STORE — عالم الموبايلات</title>
<script>
  // Apply saved theme before first paint to avoid a flash of the wrong mode.
  (function(){
    if(localStorage.getItem('theme') === 'light'){
      document.documentElement.setAttribute('data-theme','light');
    }
    window.toggleTheme = function(){
      var light = document.documentElement.getAttribute('data-theme') === 'light';
      if(light){
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme','dark');
      } else {
        document.documentElement.setAttribute('data-theme','light');
        localStorage.setItem('theme','light');
      }
      var btn = document.getElementById('theme-toggle-btn');
      if(btn) btn.textContent = document.documentElement.getAttribute('data-theme')==='light' ? '☀️' : '🌙';
    };
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e17;
    --bg-elevated:#0d1220;
    --surface:#131a2b;
    --surface-2:#1b2438;
    --border:#232c42;
    --accent:#00e5c7;
    --accent-dim:#00e5c722;
    --accent-2:#ffb020;
    --danger:#ff4569;
    --text:#eef1f8;
    --text-muted:#8b93a8;
    --text-dim:#565f78;
    --radius:18px;
  }
  html[data-theme="light"]{
    --bg:#eef1f8;
    --bg-elevated:#ffffff;
    --surface:#ffffff;
    --surface-2:#eef1f8;
    --border:#dde2f0;
    --accent:#00a893;
    --accent-dim:#00a8931f;
    --accent-2:#c97400;
    --danger:#d81b48;
    --text:#151a26;
    --text-muted:#5c6478;
    --text-dim:#8992a8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 500px at 15% -10%, #0f2a2a 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #1a1030 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    padding-bottom:80px;
    transition:background-color .2s, color .2s;
  }
  html[data-theme="light"] body{
    background:
      radial-gradient(1100px 500px at 15% -10%, #d7f3ec 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #e9e2f7 0%, transparent 55%),
      var(--bg);
  }
  html[data-theme="light"] .frame-screen{ background:#e6e9f2; }
  html[data-theme="light"] .modal-overlay{ background:#3a3f5299; }
  html[data-theme="light"] .login-error{ background:#ffe3ea; color:#a3053a; border-color:#f4b9cb; }
  html[data-theme="light"] .card:hover .card-front{ box-shadow:0 10px 30px -14px #0002, 0 0 0 1px var(--accent-dim); }
  ::selection{ background:var(--accent); color:#02110f; }

  /* ---------- Header ---------- */
  header.top{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding:34px 20px 10px;
    text-align:center;
  }
  .logo-mark{
    width:52px; height:52px; border-radius:14px;
    background:linear-gradient(155deg, var(--accent), #00998a);
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
    box-shadow:0 0 30px var(--accent-dim), inset 0 0 0 1px #ffffff33;
    flex-shrink:0;
  }
  .brand-text h1{
    font-family:'Cairo', sans-serif; font-weight:800;
    font-size:26px; margin:0; letter-spacing:.3px;
  }
  .brand-text p{
    margin:2px 0 0; color:var(--text-muted); font-size:13px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    max-width:1100px; margin:26px auto 8px; padding:0 20px;
    display:flex; flex-direction:column; gap:14px;
  }
  .search-wrap{ position:relative; }
  .search-wrap input{
    width:100%; padding:14px 46px 14px 16px; border-radius:14px;
    border:1px solid var(--border); background:var(--surface);
    color:var(--text); font-family:'Tajawal',sans-serif; font-size:15px;
    outline:none; transition:border-color .2s, box-shadow .2s;
  }
  .search-wrap input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
  .search-wrap svg{ position:absolute; top:50%; right:16px; transform:translateY(-50%); opacity:.5; }

  .filter-nav{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:thin; }
  .filter-nav::-webkit-scrollbar{ height:5px; }
  .filter-nav::-webkit-scrollbar-thumb{ background:var(--border); border-radius:10px; }
  .pill{
    flex-shrink:0; border:1px solid var(--border); background:var(--surface);
    color:var(--text-muted); padding:9px 20px; border-radius:999px; cursor:pointer;
    font-family:'Tajawal',sans-serif; font-size:14px; font-weight:500;
    transition:all .18s;
  }
  .pill:hover{ border-color:var(--accent); color:var(--text); }
  .pill.active{
    background:var(--accent); border-color:var(--accent); color:#02110f; font-weight:700;
  }

  .result-count{ color:var(--text-dim); font-size:13px; padding:0 4px; }

  /* ---------- Grid ---------- */
  .product-grid{
    max-width:1100px; margin:18px auto 0; padding:0 20px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:20px;
  }

  /* ---------- Card (signature: phone-frame) ---------- */
  /* direction:ltr isolates the 3D flip from the page's RTL context — in RTL,
     rotateY()/backface-visibility render mirrored/broken in most browsers
     unless the transformed subtree is forced back to LTR. Text direction is
     restored explicitly on .card-body / .card-back below. */
  .card{ height:340px; perspective:1200px; -webkit-perspective:1200px; cursor:pointer; direction:ltr; }
  .card-inner{
    position:relative; width:100%; height:100%;
    transition:transform .6s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d; -webkit-transform-style:preserve-3d;
  }
  .card.active .card-inner{ transform:rotateY(180deg); -webkit-transform:rotateY(180deg); }
  .card-front,.card-back{
    position:absolute; inset:0; border-radius:var(--radius);
    background:var(--surface); border:1px solid var(--border);
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    overflow:hidden;
    display:flex; flex-direction:column;
    transition:border-color .2s, box-shadow .2s;
  }
  .card:hover .card-front{ border-color:#00e5c766; box-shadow:0 10px 30px -12px #000, 0 0 0 1px #00e5c722; }
  .card-back{ transform:rotateY(180deg); -webkit-transform:rotateY(180deg); padding:18px; direction:rtl; text-align:right; }

  .frame-screen{
    position:relative; margin:14px 14px 0; border-radius:14px 14px 6px 6px;
    background:#060a12; height:170px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .frame-screen::before{ /* notch */
    content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:60px; height:10px; background:var(--surface); border-radius:0 0 10px 10px; z-index:2;
  }
  .frame-screen img{ width:100%; height:100%; object-fit:cover; }
  .frame-screen .fallback{ font-size:44px; opacity:.25; }

  .card-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1; direction:rtl; text-align:right; }
  .card-brand{ color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.5px; }
  .card-model{ font-family:'Cairo',sans-serif; font-weight:700; font-size:16px; margin:0; line-height:1.3; }
  .card-price{
    margin-top:auto; align-self:flex-start;
    font-family:'JetBrains Mono',monospace; font-weight:800;
    color:#02110f; font-size:19px;
    display:flex; align-items:baseline; gap:5px;
    background:linear-gradient(135deg, var(--accent), #00b39c);
    padding:7px 14px; border-radius:10px 10px 10px 3px;
    box-shadow:0 6px 16px -6px #00e5c799;
    position:relative;
  }
  .card-price::before{ /* price-tag hole */
    content:''; position:absolute; top:6px; left:6px;
    width:5px; height:5px; border-radius:50%; background:#02110f55;
  }
  .card-price small{ font-family:'Tajawal',sans-serif; color:#02110f; opacity:.7; font-weight:700; font-size:11px; }
  .flip-hint{ font-size:11px; color:var(--text-dim); }

  .card-back h3{ font-family:'Cairo',sans-serif; margin:0 0 8px; font-size:16px; }
  .card-back .spec{ color:var(--text-muted); font-size:13.5px; line-height:1.7; flex:1; overflow-y:auto; }
  .card-back .price-row{
    display:flex; align-items:baseline; justify-content:space-between;
    font-family:'JetBrains Mono',monospace; font-weight:800; font-size:24px; color:var(--accent);
    padding-top:12px; border-top:1px dashed var(--border); margin-top:8px;
  }
  .card-back .price-row .price-label{ font-family:'Tajawal',sans-serif; color:var(--text-muted); font-weight:500; font-size:12.5px; }
  .admin-actions{ display:flex; gap:8px; margin-top:12px; }
  .admin-actions button{
    flex:1; border:none; border-radius:10px; padding:9px 0; cursor:pointer;
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:13px;
  }
  .btn-edit-sm{ background:var(--accent-2); color:#231400; }
  .btn-del-sm{ background:var(--danger); color:#2a0009; }

  /* ---------- Empty / loading ---------- */
  .state-msg{
    grid-column:1/-1; text-align:center; color:var(--text-muted);
    padding:60px 20px; display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .state-msg .icon{ font-size:40px; opacity:.4; }
  .skeleton{ height:340px; border-radius:var(--radius); background:linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%); background-size:200% 100%; animation:shine 1.4s infinite; border:1px solid var(--border); }
  @keyframes shine{ from{background-position:200% 0;} to{background-position:-200% 0;} }

  /* ---------- Admin corner + FAB ---------- */
  .admin-corner{
    position:fixed; top:16px; left:16px; z-index:40; display:flex; gap:8px;
  }
  .theme-corner{
    position:fixed; top:16px; right:16px; z-index:40;
  }
  .icon-btn{
    width:42px; height:42px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-muted); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    transition:all .18s;
  }
  .icon-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .fab{
    position:fixed; bottom:24px; left:24px; z-index:40;
    width:58px; height:58px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(155deg, var(--accent), #00998a); color:#02110f;
    font-size:26px; box-shadow:0 8px 24px -6px #00e5c766;
    display:flex; align-items:center; justify-content:center;
    transition:transform .18s;
  }
  .fab:hover{ transform:scale(1.06); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:#03050ae0; backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    width:100%; max-width:440px; background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:26px; max-height:88vh; overflow-y:auto;
  }
  .modal h3{ font-family:'Cairo',sans-serif; margin:0 0 18px; font-size:19px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:6px; }
  .field{ margin-bottom:14px; }
  .modal input, .modal textarea{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg-elevated); color:var(--text); font-family:'Tajawal',sans-serif; font-size:14.5px;
    outline:none; resize:vertical;
  }
  .modal input:focus, .modal textarea:focus{ border-color:var(--accent); }
  .img-preview{
    width:100%; height:120px; border-radius:10px; background:var(--bg-elevated);
    border:1px dashed var(--border); display:flex; align-items:center; justify-content:center;
    overflow:hidden; margin-top:8px; color:var(--text-dim); font-size:13px;
  }
  .img-preview img{ width:100%; height:100%; object-fit:cover; }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn-primary{
    flex:2; background:var(--accent); color:#02110f; border:none; border-radius:12px;
    padding:13px; font-weight:700; cursor:pointer; font-family:'Tajawal',sans-serif; font-size:14.5px;
  }
  .btn-ghost{
    flex:1; background:transparent; color:var(--text-muted); border:1px solid var(--border);
    border-radius:12px; padding:13px; cursor:pointer; font-family:'Tajawal',sans-serif; font-size:14.5px;
  }

  /* confirm modal */
  .confirm-box{ text-align:center; }
  .confirm-box p{ color:var(--text-muted); margin:0 0 20px; font-size:14.5px; }

  .login-error{
    display:none; background:#3a0d16; color:#ff8fa3; border:1px solid #6b1b2b;
    padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:14px;
  }

  /* ---------- Toasts ---------- */
  #toast-stack{ position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px; }
  .toast{
    background:var(--surface); border:1px solid var(--border); border-inline-start:4px solid var(--accent);
    padding:13px 18px; border-radius:12px; font-size:14px; box-shadow:0 10px 30px -10px #000;
    animation:toast-in .25s ease;
  }
  .toast.err{ border-inline-start-color:var(--danger); }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  @media (prefers-reduced-motion: reduce){
    .card-inner, .fab, .toast{ transition:none; animation:none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="logo-mark">📱</div>
  <div class="brand-text">
    <h1>M.G.STORE</h1>
    <p>عالم الموبايلات — أحدث الأجهزة والأسعار</p>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <input id="search-input" type="text" placeholder="ابحث بالماركة أو الموديل...">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
  </div>
  <div class="filter-nav" id="filter-nav"></div>
  <div class="result-count" id="result-count"></div>
</div>

<div id="product-list" class="product-grid">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</div>

<div class="admin-corner">
  <button class="icon-btn" id="admin-toggle-btn" title="دخول المدير" onclick="handleAdminToggle()">🔐</button>
</div>

<div class="theme-corner">
  <button class="icon-btn" id="theme-toggle-btn" title="الوضع الليلي / النهاري" onclick="toggleTheme()">🌙</button>
</div>
<script>
  document.getElementById('theme-toggle-btn').textContent =
    document.documentElement.getAttribute('data-theme') === 'light' ? '☀️' : '🌙';
</script>

<button class="fab" id="fab-add" style="display:none" onclick="openProductModal()" title="إضافة منتج">＋</button>

<!-- Product Add/Edit Modal -->
<div class="modal-overlay" id="product-modal">
  <div class="modal">
    <h3 id="form-title">إضافة منتج جديد</h3>
    <input type="hidden" id="edit-id">
    <div class="field"><label>الماركة</label><input type="text" id="brand" placeholder="مثال: سامسونج"></div>
    <div class="field"><label>الموديل</label><input type="text" id="model" placeholder="مثال: Galaxy S24"></div>
    <div class="field"><label>المواصفات</label><textarea id="desc" rows="3" placeholder="الذاكرة، اللون، الحالة..."></textarea></div>
    <div class="field"><label>السعر (جنيه)</label><input type="number" id="price" placeholder="0"></div>
    <div class="field">
      <label>رابط الصورة</label>
      <input type="text" id="imgUrl" placeholder="https://..." oninput="updateImgPreview()">
      <div class="img-preview" id="img-preview">لا توجد صورة</div>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveProduct()">💾 حفظ</button>
      <button class="btn-ghost" onclick="closeProductModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- Confirm Delete Modal -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal confirm-box">
    <h3>حذف المنتج</h3>
    <p>هل أنت متأكد من حذف هذا المنتج؟ لا يمكن التراجع عن هذا الإجراء.</p>
    <div class="modal-actions">
      <button class="btn-primary" style="background:var(--danger); color:#2a0009" id="confirm-delete-btn">حذف نهائيًا</button>
      <button class="btn-ghost" onclick="closeConfirmModal()">تراجع</button>
    </div>
  </div>
</div>

<!-- Admin Login Modal (Firebase Authentication) -->
<div class="modal-overlay" id="login-modal">
  <div class="modal">
    <h3>🔐 دخول المدير</h3>
    <div class="login-error" id="login-error"></div>
    <div class="field"><label>البريد الإلكتروني</label><input type="email" id="login-email" placeholder="admin@example.com" autocomplete="username"></div>
    <div class="field"><label>كلمة المرور</label><input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter') submitLogin()"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="login-submit-btn" onclick="submitLogin()">دخول</button>
      <button class="btn-ghost" onclick="closeLoginModal()">إلغاء</button>
    </div>
  </div>
</div>

<div id="toast-stack"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGJQVtLATT1yFdkR58JyTxJ0kbQhnLVRg",
  authDomain: "shbrawy-shop.firebaseapp.com",
  projectId: "shbrawy-shop",
  storageBucket: "shbrawy-shop.firebasestorage.app",
  messagingSenderId: "619982205483",
  appId: "1:619982205483:web:cab9426ce2888220ef306e",
  measurementId: "G-VEWYWQM3XF"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let allProducts = [];
let currentCategory = 'الكل';
let searchTerm = '';
let isAdmin = false;
let pendingDeleteId = null;

const FALLBACK_ICON = `<div class="fallback">📵</div>`;

function toast(msg, type='ok'){
  const stack = document.getElementById('toast-stack');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='err' ? ' err' : '');
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=> el.remove(), 3200);
}

function formatPrice(p){
  const n = Number(p);
  return isNaN(n) ? p : n.toLocaleString('en-US');
}

// Real-time listener: any change made anywhere (this site, another admin,
// or directly in the Firebase console) is reflected instantly, with no
// page refresh needed.
function subscribeProducts(){
  onSnapshot(collection(db, "products"), (snapshot) => {
    allProducts = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
    renderCategories();
    renderProducts();
  }, (e) => {
    document.getElementById('product-list').innerHTML =
      `<div class="state-msg"><div class="icon">⚠️</div><div>تعذر تحميل المنتجات، تحقق من الاتصال</div></div>`;
  });
}

function renderCategories(){
  const nav = document.getElementById('filter-nav');
  const brands = ['الكل', ...new Set(allProducts.map(p => p.brand).filter(Boolean))];
  if(!brands.includes(currentCategory)) currentCategory = 'الكل';
  nav.innerHTML = brands.map(b =>
    `<button class="pill ${b===currentCategory?'active':''}" onclick="setCategory('${b.replace(/'/g,"\\'")}')">${b}</button>`
  ).join('');
}

window.setCategory = (cat) => { currentCategory = cat; renderCategories(); renderProducts(); };

window.renderProducts = () => {
  const list = document.getElementById('product-list');
  let filtered = currentCategory === 'الكل' ? allProducts : allProducts.filter(p => p.brand === currentCategory);
  if(searchTerm.trim()){
    const q = searchTerm.trim().toLowerCase();
    filtered = filtered.filter(p => `${p.brand} ${p.model}`.toLowerCase().includes(q));
  }

  document.getElementById('result-count').textContent = `${filtered.length} منتج`;

  if(filtered.length === 0){
    list.innerHTML = `<div class="state-msg"><div class="icon">🔍</div><div>لا توجد منتجات مطابقة</div></div>`;
    return;
  }

  list.innerHTML = filtered.map(p => `
    <div class="card" onclick="openProduct(this)">
      <div class="card-inner">
        <div class="card-front">
          <div class="frame-screen">
            ${p.imgUrl
              ? `<img src="${p.imgUrl}" alt="${p.brand} ${p.model}" onerror="this.parentElement.innerHTML='${FALLBACK_ICON.replace(/'/g,"\\'")}'">`
              : FALLBACK_ICON}
          </div>
          <div class="card-body">
            <div class="card-brand">${p.brand || ''}</div>
            <h3 class="card-model">${p.model || ''}</h3>
            <div class="card-price">${formatPrice(p.price)} <small>جنيه</small></div>
            <div class="flip-hint">اضغط لعرض التفاصيل ↺</div>
          </div>
        </div>
        <div class="card-back">
          <h3>${p.brand} - ${p.model}</h3>
          <div class="spec">${(p.desc || 'لا توجد مواصفات إضافية').replace(/\n/g,'<br>')}</div>
          <div class="price-row"><span class="price-label">السعر</span><span>${formatPrice(p.price)} جنيه</span></div>
          ${isAdmin ? `
          <div class="admin-actions">
            <button class="btn-edit-sm" onclick="event.stopPropagation(); editProduct('${p.id}')">✏️ تعديل</button>
            <button class="btn-del-sm" onclick="event.stopPropagation(); askDelete('${p.id}')">🗑️ حذف</button>
          </div>` : ''}
        </div>
      </div>
    </div>
  `).join('');
};

window.openProduct = (card) => card.classList.toggle('active');

document.getElementById('search-input').addEventListener('input', (e) => {
  searchTerm = e.target.value; renderProducts();
});

/* ---------- Modal helpers ---------- */
window.openProductModal = () => {
  document.getElementById('product-modal').classList.add('open');
};
window.closeProductModal = () => {
  document.getElementById('product-modal').classList.remove('open');
  resetForm();
};
function resetForm(){
  ['edit-id','brand','model','desc','price','imgUrl'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('form-title').innerText = 'إضافة منتج جديد';
  document.getElementById('img-preview').innerHTML = 'لا توجد صورة';
}
window.updateImgPreview = () => {
  const url = document.getElementById('imgUrl').value.trim();
  const box = document.getElementById('img-preview');
  if(!url){ box.innerHTML = 'لا توجد صورة'; return; }
  box.innerHTML = `<img src="${url}" onerror="this.parentElement.innerHTML='تعذر تحميل الصورة'">`;
};

window.editProduct = (id) => {
  const p = allProducts.find(item => item.id === id);
  if(!p) return;
  document.getElementById('edit-id').value = p.id;
  document.getElementById('brand').value = p.brand || '';
  document.getElementById('model').value = p.model || '';
  document.getElementById('desc').value = p.desc || '';
  document.getElementById('price').value = p.price || '';
  document.getElementById('imgUrl').value = p.imgUrl || '';
  document.getElementById('form-title').innerText = 'تعديل المنتج';
  updateImgPreview();
  openProductModal();
};

window.saveProduct = async () => {
  const brand = document.getElementById('brand').value.trim();
  const model = document.getElementById('model').value.trim();
  const price = document.getElementById('price').value;

  if(!brand || !model || price === ''){
    toast('يرجى تعبئة الماركة والموديل والسعر', 'err');
    return;
  }

  const id = document.getElementById('edit-id').value;
  const data = {
    brand, model,
    desc: document.getElementById('desc').value.trim(),
    price: Number(price),
    imgUrl: document.getElementById('imgUrl').value.trim()
  };

  try{
    if(id){
      await updateDoc(doc(db, "products", id), data);
      toast('تم تحديث المنتج بنجاح ✅');
    } else {
      await addDoc(collection(db, "products"), data);
      toast('تمت إضافة المنتج بنجاح ✅');
    }
    closeProductModal();
  }catch(e){
    toast('حدث خطأ أثناء الحفظ', 'err');
  }
};

window.askDelete = (id) => {
  pendingDeleteId = id;
  document.getElementById('confirm-modal').classList.add('open');
};
window.closeConfirmModal = () => {
  pendingDeleteId = null;
  document.getElementById('confirm-modal').classList.remove('open');
};
document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
  if(!pendingDeleteId) return;
  try{
    await deleteDoc(doc(db, "products", pendingDeleteId));
    toast('تم حذف المنتج');
    closeConfirmModal();
  }catch(e){
    toast('تعذر حذف المنتج', 'err');
  }
});

/* ---------- Admin login (Firebase Authentication) ---------- */
window.handleAdminToggle = () => {
  if(isAdmin){ logoutAdmin(); } else { openLoginModal(); }
};

window.openLoginModal = () => {
  document.getElementById('login-error').style.display = 'none';
  document.getElementById('login-email').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('login-modal').classList.add('open');
  setTimeout(() => document.getElementById('login-email').focus(), 50);
};
window.closeLoginModal = () => {
  document.getElementById('login-modal').classList.remove('open');
};

window.submitLogin = async () => {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errBox = document.getElementById('login-error');
  const btn = document.getElementById('login-submit-btn');

  if(!email || !password){
    errBox.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور';
    errBox.style.display = 'block';
    return;
  }

  btn.disabled = true; btn.textContent = 'جارٍ الدخول...';
  try{
    await signInWithEmailAndPassword(auth, email, password);
    closeLoginModal();
    toast('تم الدخول كمدير ✅');
    // isAdmin + UI refresh happen in onAuthStateChanged
  }catch(e){
    let msg = 'بيانات الدخول غير صحيحة';
    if(e.code === 'auth/too-many-requests') msg = 'محاولات كثيرة، حاول لاحقًا';
    if(e.code === 'auth/invalid-email') msg = 'البريد الإلكتروني غير صالح';
    errBox.textContent = msg;
    errBox.style.display = 'block';
  }finally{
    btn.disabled = false; btn.textContent = 'دخول';
  }
};

function logoutAdmin(){
  signOut(auth);
  toast('تم تسجيل الخروج');
}

function refreshAdminUI(){
  document.getElementById('admin-toggle-btn').textContent = isAdmin ? '🔓' : '🔐';
  document.getElementById('admin-toggle-btn').title = isAdmin ? 'خروج المدير' : 'دخول المدير';
  document.getElementById('fab-add').style.display = isAdmin ? 'flex' : 'none';
  renderProducts();
}

onAuthStateChanged(auth, (user) => {
  isAdmin = !!user;
  refreshAdminUI();
});

subscribeProducts();
</script>
</body>
</html>
