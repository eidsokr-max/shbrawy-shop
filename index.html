<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>M.G.STORE — Sign In</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="brand">M.G.<span>STORE</span></div>
    <div class="auth-actions" id="authActions">
      <button id="btnShowLogin" class="btn btn-ghost">Log In</button>
      <button id="btnShowSignup" class="btn btn-primary">Sign Up</button>
    </div>
    <div class="user-actions hidden" id="userActions">
      <span id="userEmailLabel" class="user-email"></span>
      <span id="roleBadge" class="badge hidden">Admin</span>
      <button id="btnLogout" class="btn btn-ghost">Log Out</button>
    </div>
  </header>

  <!-- ============ APP CONTENT (placeholder for later phases) ============ -->
  <main class="app-content">
    <div id="guestView">
      <h1>Welcome to M.G.STORE</h1>
      <p>Please sign up or log in to continue.</p>
    </div>
    <div id="memberView" class="hidden">
      <h1>Dashboard</h1>
      <p id="memberWelcome"></p>
      <div id="adminPanel" class="hidden admin-panel">
        <h2>Admin Panel</h2>
        <p>You have administrator privileges.</p>
      </div>
    </div>
  </main>

  <!-- ============ SIGN UP MODAL ============ -->
  <div class="modal-overlay hidden" id="signupOverlay">
    <div class="modal">
      <button class="modal-close" data-close="signupOverlay">&times;</button>
      <h2>Create Account</h2>
      <form id="signupForm" novalidate>
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email" />

        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" />

        <label for="signupConfirm">Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="Re-enter password" required minlength="8" autocomplete="new-password" />

        <div class="form-message" id="signupMessage"></div>

        <button type="submit" class="btn btn-primary btn-block" id="signupSubmitBtn">
          <span class="btn-text">Sign Up</span>
          <span class="spinner hidden"></span>
        </button>
      </form>
      <p class="switch-link">Already have an account? <a href="#" id="switchToLogin">Log in</a></p>
    </div>
  </div>

  <!-- ============ LOGIN MODAL ============ -->
  <div class="modal-overlay hidden" id="loginOverlay">
    <div class="modal">
      <button class="modal-close" data-close="loginOverlay">&times;</button>
      <h2>Log In</h2>
      <form id="loginForm" novalidate>
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email" />

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Your password" required autocomplete="current-password" />

        <div class="form-message" id="loginMessage"></div>

        <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">
          <span class="btn-text">Log In</span>
          <span class="spinner hidden"></span>
        </button>
      </form>
      <p class="switch-link">Don't have an account? <a href="#" id="switchToSignup">Sign up</a></p>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
